name: Compilar APK GB SMART

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential git zip unzip wget curl \
            libssl-dev libffi-dev zlib1g-dev \
            libgdbm-dev libncurses5-dev libbz2-dev \
            libreadline-dev libsqlite3-dev \
            autoconf libtool pkg-config cmake

      - name: Instalar Buildozer y Cython
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==3.0.0

      - name: Instalar Android SDK con sdkmanager
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          SDK=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK/cmdline-tools

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d $SDK/cmdline-tools
          mv $SDK/cmdline-tools/cmdline-tools $SDK/cmdline-tools/latest
          rm cmdtools.zip

          SDKMANAGER=$SDK/cmdline-tools/latest/bin/sdkmanager

          # Aceptar todas las licencias
          yes | $SDKMANAGER --sdk_root=$SDK --licenses > /dev/null 2>&1 || true

          # Instalar build-tools y platform-tools
          $SDKMANAGER --sdk_root=$SDK \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.0" 2>&1 | tail -5

          # Crear symlink en ruta legacy que buildozer busca
          mkdir -p $SDK/tools/bin
          ln -sf $SDKMANAGER $SDK/tools/bin/sdkmanager

          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "Android SDK listo en $SDK"

      - name: Agregar swap (RAM extra para compilar Kivy)
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Cachear Buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-v3-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-v3-

      - name: Compilar APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          set +o pipefail
          yes | buildozer android debug 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[1]}
          set -o pipefail
          if [ $BUILD_EXIT -ne 0 ]; then
            echo ""
            echo "====== ÚLTIMAS 80 LÍNEAS ======"
            tail -80 build.log
            exit 1
          fi

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: GB-SMART-APK
          path: bin/*.apk
          retention-days: 30

      - name: Crear Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "GB SMART ${{ github.ref_name }}"
          files: bin/*.apk
          body: |
            ## GB SMART ${{ github.ref_name }}

            ### Instalación en Android
            1. Descarga el archivo `.apk`
            2. En tu Android: **Ajustes → Seguridad → Fuentes desconocidas** → activar
            3. Abre el APK e instala

            > Requiere Android 8.0 (API 26) o superior

            ---
            Proyecto universitario ITTLA 2026 · Python / KivyMD
