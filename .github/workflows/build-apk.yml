name: Compilar APK GB SMART

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Compilar APK (imagen Docker oficial de Kivy)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/home/user/hostcwd \
            kivy/buildozer:latest \
            android debug 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "====== ÚLTIMAS 100 LÍNEAS ======"
            tail -100 build.log
            exit 1
          fi

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: GB-SMART-APK
          path: bin/*.apk
          retention-days: 30

      - name: Crear Release en GitHub con el APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "GB SMART ${{ github.ref_name }}"
          files: bin/*.apk
          body: |
            ## GB SMART ${{ github.ref_name }}

            ### Instalación en Android
            1. Descarga el archivo `.apk`
            2. En tu Android: **Ajustes → Seguridad → Fuentes desconocidas** → activar
            3. Abre el APK e instala

            > Requiere Android 8.0 (API 26) o superior

            ---
            Proyecto universitario ITTLA 2026 · Python / KivyMD
